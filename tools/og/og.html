<!doctype html>
<!-- Link-preview card (og:image), 1200x630. Rendered to /og-v2.png by tools/og/render.js.
     Built from the site's own language: black, light KOTA type, glass pills, thin-bordered site cards (the reel),
     one picture in a Clearwell pill. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:VWS;src:url(/assets/fonts/inter-latin.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;background:#000}
#c{position:relative;width:1200px;height:630px;overflow:hidden;background:#000;font-family:VWS,Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
/* the wall: same blurred portfolio wall the hero uses, very dark */
.wall{position:absolute;inset:0;background:url(/assets/hero/kh-bg.jpg) center/cover;opacity:.32;filter:saturate(.7)}
.wall:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.92) 42%,rgba(0,0,0,.35) 100%)}
/* glass pill (header logo) */
.g{position:absolute;display:flex;align-items:center;gap:10px;border-radius:100px;background:rgba(153,153,153,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.logo{left:56px;top:52px;height:56px;padding:0 22px 0 12px}
.logo svg{width:28px;height:33px}
.logo b{font-weight:500;font-size:24px;letter-spacing:-.02em}
h1{position:absolute;left:56px;top:172px;margin:0;font-weight:400;font-size:70px;line-height:72px;letter-spacing:-2.3px;width:640px}
h1 i{font-style:normal;color:rgba(255,255,255,.42)}
.foot{position:absolute;left:56px;bottom:52px;display:flex;align-items:center;gap:14px}
.url{font-size:18px;color:rgba(255,255,255,.78);letter-spacing:-.01em}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35)}
.loc{font-size:18px;color:rgba(255,255,255,.5)}
.cta{position:static;height:48px;padding:0 22px;background:#fff;color:#0b0f19;font-size:17px;font-weight:500;box-shadow:none;margin-right:10px}
/* right: a rising column of site cards (the reel) + one Clearwell pill */
.col{position:absolute;right:-30px;top:-40px;width:470px;height:720px;transform:rotate(-6deg);transform-origin:50% 50%}
.card{position:absolute;left:0;width:430px;height:269px;border:2px solid rgba(255,255,255,.9);border-radius:8px;overflow:hidden;background:#111;box-shadow:0 30px 60px rgba(0,0,0,.55)}
.card img,.pill img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.pill{position:absolute;left:250px;top:220px;width:300px;height:180px;border-radius:200px;overflow:hidden;box-shadow:0 0 0 2px #000,0 24px 60px rgba(0,0,0,.6)}
.fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#000 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 82%,#000 100%)}
.rate{right:56px;bottom:52px;height:44px;padding:0 18px;font-size:16px;gap:8px}
.rate svg{width:14px;height:14px}
</style></head><body><div id="c">
<div class="wall"></div>
<div class="col">
  <div class="card" style="top:-60px"><img src="/assets/portfolio/luxury-residences.jpg"></div>
  <div class="card" style="top:232px;left:40px"><img src="/assets/portfolio/strength-gym.jpg"></div>
  <div class="card" style="top:524px"><img src="/assets/portfolio/therapy-practice.jpg"></div>
  <div class="pill"><img src="/assets/portfolio/water-filtration.jpg" style="object-position:50% 30%"></div>
</div>
<div class="fade"></div>
<div class="g logo"><svg viewBox="0 0 80 94" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Visionary Web Studio logo"><defs><filter id="vws-glow-a-k1" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="9" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><filter id="vws-glow-b-k1" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4.5" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><filter id="vws-glow-c-k1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs><path d="M 11,2 L 69,2 L 78,11 L 78,67 L 40,91 L 2,67 L 2,11 Z" stroke="rgba(225,224,204,0.18)" stroke-width="1.5" fill="rgba(255,255,255,0.02)"></path><path d="M 15,7 L 65,7 L 73,15 L 73,64 L 40,86 L 7,64 L 7,15 Z" stroke="rgba(225,224,204,0.07)" stroke-width="1" fill="none"></path><path d="M 2,11 L 11,2 L 25,2 L 25,7 L 15,7 L 7,15 Z" fill="rgba(225,224,204,0.09)" stroke="rgba(225,224,204,0.15)" stroke-width="0.5"></path><path d="M 78,11 L 69,2 L 55,2 L 55,7 L 65,7 L 73,15 Z" fill="rgba(225,224,204,0.09)" stroke="rgba(225,224,204,0.15)" stroke-width="0.5"></path><polygon points="77,4 61,4 40,80 37,80" fill="rgba(225,224,204,0.28)"></polygon><polygon points="3,4 19,4 40,80 37,80" fill="rgba(225,224,204,0.08)"></polygon><polygon points="3,4 19,4 40,80 37,80" fill="#1d4ed8" filter="url(#vws-glow-a-k1)" class="v-glow-outer"></polygon><polygon points="5,4 17,4 40,78 38,78" fill="#3b82f6" filter="url(#vws-glow-b-k1)" class="v-glow-mid"></polygon><line x1="19" y1="4" x2="40" y2="80" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" filter="url(#vws-glow-c-k1)" class="v-glow-core"></line></svg><b>Visionary</b></div>
