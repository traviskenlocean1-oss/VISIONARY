<!doctype html>
<!-- The hero reel, as an animation: site cards with a thin white border on black,
     after KOTA's reel (single card swaps, a 3D stack flying in, a rising column,
     a big card with zoom-blur cuts). tools/make-reel.js renders it frame by frame
     with render(t) and encodes assets/hero/reel.mp4. Seamless loop at t = D. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
#s{position:relative;width:1920px;height:1080px;background:#000;perspective:1500px;perspective-origin:50% 38%;overflow:hidden}
.c{position:absolute;left:50%;top:50%;width:720px;height:450px;margin:-225px 0 0 -360px;box-sizing:border-box;border:2px solid rgba(255,255,255,.92);border-radius:4px;overflow:hidden;background:#111;backface-visibility:hidden;will-change:transform,opacity,filter}
.c img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
</style></head><body><div id="s"></div>
<script>
const SITES = ['therapy-practice', 'water-filtration', 'strength-gym', 'luxury-residences', 'medical-spa-golden', 'streetwear',
  'interior-design', 'burger-restaurant', 'luxury-jewelry', 'real-estate', 'pool-builder', 'home-builder'].map(n => '/assets/portfolio/' + n + '.jpg');
const D = 14;
const stage = document.getElementById('s');
const pool = []; // reusable card elements
function card(i) { if (!pool[i]) { const d = document.createElement('div'); d.className = 'c'; d.innerHTML = '<img>'; stage.appendChild(d); pool[i] = d; } return pool[i]; }
const ease = t => 1 - Math.pow(1 - t, 3), inout = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
function put(i, site, tf, op, blur) {
  const c = card(i), img = c.firstChild, src = SITES[((site % SITES.length) + SITES.length) % SITES.length];
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  c.style.display = ''; c.style.transform = tf; c.style.opacity = op == null ? 1 : op; c.style.filter = blur ? 'blur(' + blur.toFixed(2) + 'px)' : 'none'; c.style.zIndex = 100 + i;
}
window.render = function (t) {
  pool.forEach(c => c.style.display = 'none');
  if (t < 2.4) {                       // A: one card, swapping sites
    const k = Math.floor(t / 0.6), u = (t - k * 0.6) / 0.6, e = ease(cl(u / 0.4));
    put(0, k, `translateY(${(1 - e) * 26}px) scale(${0.94 + 0.06 * e})`, 0.25 + 0.75 * e);
  } else if (t < 4.8) {                // B: 3D stack of cards flying toward the camera
    const u = (t - 2.4) / 2.4, fly = inout(u) * 2600;
    for (let i = 0; i < 9; i++) {
      const z = -i * 380 + fly - 700, y = -i * 58 + inout(u) * 380;
      const op = cl((z + 3600) / 900) * cl((1250 - z) / 220);
      if (op <= 0) continue;
      put(i, 4 + i, `translate3d(0,${y}px,${z}px) rotateX(${14 - 10 * u}deg)`, op, Math.max(0, (z - 700) / 90));
    }
  } else if (t < 9.0) {                // C: a column of cards rising
    const u = (t - 4.8) / 4.2, W = 806 / 720, gap = 84, step = 450 * W + gap;
    const off = inout(u) * step * 6.2 - step * 0.6;   // starts with the first card entering from below
    for (let i = 0; i < 9; i++) {
      const y = i * step - off + 1080 * 0.18;
      if (y < -900 || y > 1200) continue;
      put(i, 1 + i, `translateY(${y}px) scale(${W})`, 1, Math.abs(Math.sin(Math.PI * u)) * 0.8);
    }
  } else if (t < 11.6) {               // D: one big card, zoom-blur cuts between sites
    const k = Math.floor((t - 9.0) / 0.866), u = ((t - 9.0) - k * 0.866) / 0.866, S = 998 / 720;
    const inE = ease(cl(u / 0.35)), outE = cl((u - 0.8) / 0.2);
    put(0, 6 + k, `scale(${S * (0.96 + 0.04 * inE) * (1 + 0.1 * outE * outE)})`, Math.min(inE, 1 - outE * 0.9), outE * 10);
  } else {                             // E: the last big card settles back to the opening size: loop
    const u = (t - 11.6) / (D - 11.6), e = inout(u), S = 998 / 720;
    put(0, 8, `scale(${S + (1 - S) * e}) translateY(${-40 * Math.sin(Math.PI * e)}px)`, 1 - cl((u - 0.75) / 0.25));
    put(1, 0, `translateY(${(1 - e) * 120}px) scale(${0.94 + 0.06 * e})`, cl((u - 0.75) / 0.25));
  }
};
window.ready = Promise.all(SITES.map(s => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = s; })));
</script></body></html>
