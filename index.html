  <script>
  /* ── PATCH: fix frozen GSAP scroll animations + Services dropdown ── */
  (function() {
    function fixSite() {
      /* 1. Unfreeze every section element stuck at opacity:0 by GSAP */
      document.querySelectorAll('section *').forEach(function(el) {
        var s = el.getAttribute('style') || '';
        var m = s.match(/(?:^|;)\s*opacity:\s*([\d.]+)/);
        if (m && parseFloat(m[1]) === 0) {
          el.style.opacity = '1';
          if (s.indexOf('translateY') !== -1 || s.indexOf('translateX') !== -1) {
            el.style.transform = 'none';
          }
          if (s.indexOf('scale(0') !== -1) {
            el.style.transform = 'none';
          }
        }
      });

      /* 2. Build Services dropdown if the nav is rendered and dropdown not yet injected */
      var servicesLink = Array.from(document.querySelectorAll('nav a')).find(function(a) {
        return a.textContent.trim() === 'Services';
      });
      if (!servicesLink || servicesLink.parentElement.querySelector('[data-vws-dd]')) return;

      var wrapper = servicesLink.parentElement;
      wrapper.style.position = 'relative';

      var items = [
        { label: 'Website Development',  href: '/services/website-development' },
        { label: 'Hosting & Domain',     href: '/services/hosting-domain' },
        { label: 'Website Maintenance',  href: '/services/website-maintenance' },
        { label: 'Website Creation',     href: '/services/website-creation' },
        { label: 'Website Redesign',     href: '/services/website-redesign' },
        { label: 'Logo & Branding',      href: '/services/logo-branding' }
      ];

      var dd = document.createElement('div');
      dd.setAttribute('data-vws-dd', '1');
      dd.style.cssText = [
        'position:absolute',
        'top:calc(100% + 10px)',
        'left:50%',
        'transform:translateX(-50%)',
        'background:#080d1c',
        'border:1px solid rgba(225,224,204,0.1)',
        'border-radius:10px',
        'min-width:230px',
        'padding:6px',
        'opacity:0',
        'visibility:hidden',
        'transition:opacity 0.18s,visibility 0.18s',
        'z-index:9999',
        'box-shadow:0 20px 60px rgba(0,0,0,0.6)'
      ].join(';');

      items.forEach(function(svc) {
        var a = document.createElement('a');
        a.href = svc.href;
        a.textContent = svc.label;
        a.style.cssText = [
          'display:block',
          'padding:10px 16px',
          'color:rgba(225,224,204,0.55)',
          'font-size:10px',
          'font-weight:700',
          'letter-spacing:0.18em',
          'text-transform:uppercase',
          'text-decoration:none',
          'border-radius:6px',
          'transition:background 0.15s,color 0.15s'
        ].join(';');
        a.addEventListener('mouseenter', function() {
          a.style.background = 'rgba(255,255,255,0.05)';
          a.style.color = 'rgba(225,224,204,1)';
        });
        a.addEventListener('mouseleave', function() {
          a.style.background = '';
          a.style.color = 'rgba(225,224,204,0.55)';
        });
        dd.appendChild(a);
      });

      wrapper.appendChild(dd);

      /* Services link itself navigates to /services — dropdown shows on hover only */
      wrapper.addEventListener('mouseenter', function() {
        dd.style.opacity = '1';
        dd.style.visibility = 'visible';
        var chevron = servicesLink.querySelector('svg');
        if (chevron) chevron.style.transform = 'rotate(180deg)';
      });
      wrapper.addEventListener('mouseleave', function() {
        dd.style.opacity = '0';
        dd.style.visibility = 'hidden';
        var chevron = servicesLink.querySelector('svg');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      });

      /* Kill any React-generated dropdown that appears in this wrapper dynamically */
      var reactDDObserver = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.nodeType === 1 && !node.getAttribute('data-vws-dd')) {
              node.style.cssText += ';display:none!important;visibility:hidden!important';
            }
          });
        });
      });
      reactDDObserver.observe(wrapper, { childList: true });
    }

    /* Fix the GSAP mouse-track glow: reposition it to hero center so blue glow is visible */
    function fixGlow() {
      var glow = Array.from(document.querySelectorAll('div')).find(function(el) {
        return el.classList.contains('fixed') && el.classList.contains('inset-0') && el.classList.contains('pointer-events-none');
      });
      if (glow) {
        var cx = Math.round(window.innerWidth * 0.35);
        var cy = Math.round(window.innerHeight * 0.45);
        glow.style.backgroundImage = 'radial-gradient(700px at ' + cx + 'px ' + cy + 'px, rgba(37,99,235,0.18), rgba(0,0,0,0) 80%)';
      }
    }

    /* Run once React has mounted — poll until sections exist */
    var attempts = 0;
    var poll = setInterval(function() {
      attempts++;
      if (document.querySelectorAll('section').length > 1 || attempts > 60) {
        clearInterval(poll);
        fixSite();
        fixGlow();
        setTimeout(fixSite, 800);
        setTimeout(fixGlow, 800);
      }
    }, 100);
  })();
  </script>

      '<span id="vws-badge" style="position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:100px;padding:0 5px;display:none;align-items:center;justify-content:center;border:2px solid #060916">1</span>'

    /* ── State ── */
    var isOpen = false;

    function openChat() {
      isOpen = true;

    function closeChat() {
      isOpen = false;
      win.style.display = 'none';

    function hideBadge() { unread = 0; document.getElementById('vws-badge').style.display = 'none'; }

    /* ── Messaging ── */
    function addMsg(html, isUser, time) {
      var msgs = document.getElementById('vws-msgs');
      var wrap = document.createElement('div');
      wrap.style.cssText = 'padding:0 14px;display:flex;gap:8px;align-items:flex-end' + (isUser ? ';flex-direction:row-reverse' : '');

      var bubble = document.createElement('div');

        ? 'background:linear-gradient(135deg,#1d4ed8,#2563eb);border-radius:14px 14px 2px 14px;padding:10px 14px;font-size:13px;color:#fff;line-height:1.6;max-width:84%'
        : 'background:#0d1228;border:1px solid rgba(255,255,255,.07);border-radius:14px 14px 14px 2px;padding:10px 14px;font-size:13px;color:rgba(225,224,204,.9);line-height:1.6;max-width:84%';

    function showTyping() {
      var msgs = document.getElementById('vws-msgs');

        '<span class="vws-dot-1" style="width:7px;height:7px;border-radius:50%;background:rgba(225,224,204,.5);display:inline-block"></span>' +

    function hideTyping() {
      var t = document.getElementById('vws-typing');

    function now() {
      var d = new Date();
      var h = d.getHours(), m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
    }

    function setStatus(text) {
      document.getElementById('vws-status').innerHTML =
        '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;margin-right:5px"></span>' + text;
    }

    function botSay(nodeKey, replacements) {
      var node = TREE[nodeKey];
      if (!node) return;
      currentNode = nodeKey;

      /* Clear quick replies while typing */
      document.getElementById('vws-qr').innerHTML = '';
      document.getElementById('vws-form').style.display = 'none';
      setStatus('Assistant is typing…');

      showTyping();
      var delay = 900 + Math.min(node.bot.length * 12, 1400);

      setTimeout(function() {
        hideTyping();
        setStatus('Live Chat · Online now');
        var text = node.bot;
        if (replacements) {
          Object.keys(replacements).forEach(function(k){
            text = text.replace(new RegExp('{' + k + '}', 'g'), replacements[k]);
          });

        addMsg(text, false, now());

          /* Show lead capture form */
          document.getElementById('vws-form').style.display = 'block';
          setTimeout(function(){ document.getElementById('vws-fname').focus(); }, 100);

          /* Done — no further interaction needed */

          /* Show quick replies */

    /* ── Free-text input ── */

        return { msg: "Here's the pricing breakdown:\n\n💰 <b>Starter — $500</b> · 1 page, fast launch\n💰 <b>Standard — $750</b> · Up to 5 pages, most popular for service businesses\n💰 <b>Full Build — $1,000</b> · Up to 10 pages, blog, advanced SEO, logo included\n🔧 <b>Maintenance — $100/mo</b> · Unlimited updates, same-day turnaround\n\nOne-time fees. You own the site outright — no subscriptions, no platform lock-in.\n\nWhich package sounds right for you?", next: 'pricing' };
      }

      }

      if (/\b(contact|call|phone|reach|talk|speak|number|email|text|message)\b/.test(t)) {
        return { msg: "You can reach our team anytime:\n\n📞 <a href='tel:+15618890507' style='color:#60a5fa'>(561) 889-0507</a> — call or text\n📧 visionarywebstudio6@gmail.com\n\nOr drop your name and number here and we'll follow up within a few hours — usually same day.", next: 'capture' };

      }

        "Ha, that's one for another day! 😄 What we <i>do</i> know inside and out is building websites that rank on Google and convert visitors into real customers.\n\nWe've done it for contractors, detailers, trainers, and dozens of local businesses. Want to see how we can do it for yours?",
        "Outside our wheelhouse — but here's what's very much <i>in</i> our wheelhouse:\n\n🏆 #1 thing we do: custom websites that actually get local businesses found and called.\n\nFast turnaround, full SEO, you own it outright. Starting at $500.\n\nInterested in learning more?"

    function makeQR(qr, items) {
      items.forEach(function(item) {
        var b = document.createElement('button');
        b.textContent = item.label;
        b.style.cssText = 'background:#0e1525;border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:7px 13px;font-size:11px;font-weight:600;color:rgba(225,224,204,.75);cursor:pointer;transition:background .15s,color .15s,border-color .15s';

          addMsg(item.label, true, now());
          qr.innerHTML = '';
          botSay(item.next);
        });
        qr.appendChild(b);
      });
    }

    function sendFreeText() {
      var inp = document.getElementById('vws-input');
      var text = inp.value.trim();
      if (!text) return;
      addMsg(text, true, now());
      inp.value = '';
      document.getElementById('vws-qr').innerHTML = '';
      setTimeout(function(){
        showTyping();
        var reply = getFreeReply(text);
        setTimeout(function(){
          hideTyping();
          addMsg(reply.msg, false, now());
          var qr = document.getElementById('vws-qr');
          makeQR(qr, [
            {label:'Yes, have the team reach out', next:'capture'},
            {label:'See pricing',                  next:'pricing'},
            {label:'Just browsing',                next:'browse'}
          ]);
        }, 1000);
      }, 200);
    }
    document.getElementById('vws-send').addEventListener('click', sendFreeText);
    document.getElementById('vws-input').addEventListener('keydown', function(e){ if(e.key==='Enter') sendFreeText(); });

    /* ── Auto-open after 8s (if not dismissed this session) ── */
    if (!sessionStorage.getItem(DISMISSED_KEY)) {
      setTimeout(function(){
        if (!isOpen && !sessionStorage.getItem(OPENED_KEY)) {
          sessionStorage.setItem(OPENED_KEY, '1');
          /* Show badge first for 2s, then open */
          showBadge(1);
          setTimeout(function(){ if (!isOpen) openChat(); }, 2000);
        }
      }, 8000);
    }
  }

  /* ── Wait for React to mount then inject ── */
  var chatAttempts = 0;
  var chatPoll = setInterval(function(){
    chatAttempts++;
    var reactChat = Array.from(document.querySelectorAll('*')).find(function(el){
      var s = window.getComputedStyle(el);
      return s.position==='fixed' && s.bottom==='24px' && s.right==='24px';
    });
    if (reactChat || chatAttempts > 80) {
      clearInterval(chatPoll);
      buildChat();
    }
  }, 150);
  })();

  <script>
  (function(){

        orig.apply(this, arguments);

    patchHistory('pushState');
    patchHistory('replaceState');

      ['vws-ba-injected','vws-deepdive','vws-svc-theme','vws-svc-listing'].forEach(function(id){
        var el = document.getElementById(id);

      } else if (isServicesIndex()) {
        runServicesListing();
      }

          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px">',
            '<div style="background:rgba(153,27,27,0.07);border:1px solid rgba(239,68,68,0.15);border-radius:12px;padding:20px">',
              '<div style="font-size:11px;font-weight:700;color:#f87171;letter-spacing:0.1em;margin-bottom:10px">PROBLEMS YOU HAVE NOW</div>',
              '<ul style="list-style:none;padding:0;margin:0">'+buildBullets(svc.beforeItems,'#f87171')+'</ul>',
            '</div>',
            '<div style="background:rgba('+svc.color.slice(1)+',0.07);border:1px solid rgba('+svc.color.slice(1)+',0.25);border-radius:12px;padding:20px">',
              '<div style="font-size:11px;font-weight:700;color:'+svc.lt+';letter-spacing:0.1em;margin-bottom:10px">WHAT YOU GET INSTEAD</div>',
              '<ul style="list-style:none;padding:0;margin:0">'+buildGoodBullets(svc.afterItems,svc.lt)+'</ul>',
            '</div>',
          '</div>',
        '</div>'
      ].join('');

      /* ── Inject stats bar + deep dive after React main content ── */
      if (document.getElementById('vws-deepdive')) return;
      var deepdive = document.createElement('section');
      deepdive.id = 'vws-deepdive';
      deepdive.style.cssText = 'background:#060916;padding:0 0 80px;font-family:Barlow,system-ui,sans-serif';
      deepdive.innerHTML = [
        /* Stats bar */
        '<div style="max-width:900px;margin:0 auto 60px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden">',
          buildStats(svc),
        '</div>',
        /* Pitch + what you get */
        '<div style="max-width:900px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start">',
          '<div>',
            '<div style="font-size:10px;font-weight:700;color:'+svc.lt+';letter-spacing:0.2em;text-transform:uppercase;margin-bottom:12px">Why It Matters</div>',
            '<div style="font-size:22px;font-weight:900;color:#fff;line-height:1.3;margin-bottom:16px">The Standard Is Higher Than You Think</div>',
            '<div style="font-size:14px;color:rgba(225,224,204,0.6);line-height:1.7">'+svc.pitch+'</div>',
            '<div style="margin-top:24px"><a href="/contact" style="display:inline-block;background:'+svc.color+';color:#fff;font-size:12px;font-weight:800;letter-spacing:0.1em;padding:13px 28px;border-radius:8px;text-decoration:none;text-transform:uppercase;box-shadow:0 8px 30px '+svc.glow+'">Start Your Project →</a></div>',
          '</div>',
          '<div>',
            '<div style="font-size:10px;font-weight:700;color:'+svc.lt+';letter-spacing:0.2em;text-transform:uppercase;margin-bottom:16px">Everything Included</div>',
            '<ul style="list-style:none;padding:0;margin:0">'+buildGets(svc)+'</ul>',
          '</div>',
        '</div>',
      ].join('');

      /* Insert after root or append to body */
      var root = document.getElementById('root');
      if (root && root.parentElement) {
        root.parentElement.insertBefore(deepdive, root.nextSibling);
      } else {
        document.body.appendChild(deepdive);
      }
    }

      /* ── Poll for React render on this service page ── */
      var svcAttempts = 0;
      var svcPoll = setInterval(function(){
        svcAttempts++;
        if (document.querySelectorAll('section').length > 0 || svcAttempts > 100) {
          clearInterval(svcPoll);
          enhance();
          setTimeout(enhance, 1000);
        }
      }, 150);
    } /* end runServiceDetail */

    /* ── Kick off on initial load ── */
    setTimeout(runAll, 400);
  })();
  </script>
  </body>
</html>
