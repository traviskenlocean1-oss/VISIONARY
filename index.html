  <script>
  /* ── PATCH: fix frozen GSAP scroll animations + Services dropdown ── */
  (function() {
    function fixSite() {
      /* 1. Unfreeze every section element stuck at opacity:0 by GSAP */
      document.querySelectorAll('section *').forEach(function(el) {
        var s = el.getAttribute('style') || '';
        var m = s.match(/(?:^|;)\s*opacity:\s*([\d.]+)/);
        if (m && parseFloat(m[1]) === 0) {
          el.style.opacity = '1';
          if (s.indexOf('translateY') !== -1 || s.indexOf('translateX') !== -1) {
            el.style.transform = 'none';
          }
          if (s.indexOf('scale(0') !== -1) {
            el.style.transform = 'none';
          }
        }
      });

      /* 2. Build Services dropdown if the nav is rendered and dropdown not yet injected */
      var servicesLink = Array.from(document.querySelectorAll('nav a')).find(function(a) {
        return a.textContent.trim() === 'Services';
      });
      if (!servicesLink || servicesLink.parentElement.querySelector('[data-vws-dd]')) return;

      var wrapper = servicesLink.parentElement;
      wrapper.style.position = 'relative';

      var items = [
        'Website Development',
        'Hosting & Domain',
        'Website Maintenance',
        'Website Creation',
        'Website Redesign',
        'Logo & Branding'
      ];

      var dd = document.createElement('div');
      dd.setAttribute('data-vws-dd', '1');
      dd.style.cssText = [
        'position:absolute',
        'top:calc(100% + 10px)',
        'left:50%',
        'transform:translateX(-50%)',
        'background:#080d1c',
        'border:1px solid rgba(225,224,204,0.1)',
        'border-radius:10px',
        'min-width:230px',
        'padding:6px',
        'opacity:0',
        'visibility:hidden',
        'transition:opacity 0.18s,visibility 0.18s',
        'z-index:9999',
        'box-shadow:0 20px 60px rgba(0,0,0,0.6)'
      ].join(';');

      items.forEach(function(svc) {
        var a = document.createElement('a');
        a.href = '/services';
        a.textContent = svc;
        a.style.cssText = [
          'display:block',
          'padding:10px 16px',
          'color:rgba(225,224,204,0.55)',
          'font-size:10px',
          'font-weight:700',
          'letter-spacing:0.18em',
          'text-transform:uppercase',
          'text-decoration:none',
          'border-radius:6px',
          'transition:background 0.15s,color 0.15s'
        ].join(';');
        a.addEventListener('mouseenter', function() {
          a.style.background = 'rgba(255,255,255,0.05)';
          a.style.color = 'rgba(225,224,204,1)';
        });
        a.addEventListener('mouseleave', function() {
          a.style.background = '';
          a.style.color = 'rgba(225,224,204,0.55)';
        });
        dd.appendChild(a);
      });

      wrapper.appendChild(dd);

      /* prevent navigating on Services click — open dropdown instead */
      servicesLink.addEventListener('click', function(e) { e.preventDefault(); });

      wrapper.addEventListener('mouseenter', function() {
        dd.style.opacity = '1';
        dd.style.visibility = 'visible';
        var chevron = servicesLink.querySelector('svg');
        if (chevron) chevron.style.transform = 'rotate(180deg)';
      });
      wrapper.addEventListener('mouseleave', function() {
        dd.style.opacity = '0';
        dd.style.visibility = 'hidden';
        var chevron = servicesLink.querySelector('svg');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      });
    }

    /* Run once React has mounted — poll until sections exist */
    var attempts = 0;
    var poll = setInterval(function() {
      attempts++;
      if (document.querySelectorAll('section').length > 1 || attempts > 60) {
        clearInterval(poll);
        fixSite();
        setTimeout(fixSite, 800);
      }
    }, 100);
  })();
  </script>

      b.style.animation = 'vws-badge .25s cubic-bezier(.22,.68,0,1.4) both';
    }
    function hideBadge() { unread = 0; document.getElementById('vws-badge').style.display = 'none'; }

    /* ── Messaging ── */
    function addMsg(html, isUser, time) {
      var msgs = document.getElementById('vws-msgs');
      var wrap = document.createElement('div');
      wrap.style.cssText = 'padding:0 14px;display:flex;gap:8px;align-items:flex-end' + (isUser ? ';flex-direction:row-reverse' : '');

      var bubble = document.createElement('div');
      bubble.className = 'vws-msg-anim';
      bubble.style.cssText = isUser
        ? 'background:linear-gradient(135deg,#1d4ed8,#2563eb);border-radius:14px 14px 2px 14px;padding:10px 14px;font-size:13px;color:#fff;line-height:1.6;max-width:84%'
        : 'background:#0d1228;border:1px solid rgba(255,255,255,.07);border-radius:14px 14px 14px 2px;padding:10px 14px;font-size:13px;color:rgba(225,224,204,.9);line-height:1.6;max-width:84%';
      bubble.innerHTML = html.replace(/\n/g, '<br>');

      if (time) {
        var ts = document.createElement('div');
        ts.style.cssText = 'font-size:9px;color:rgba(225,224,204,.25);margin-top:4px;text-align:' + (isUser ? 'right' : 'left');
        ts.textContent = time;
        var col = document.createElement('div');
        col.style.cssText = 'display:flex;flex-direction:column;max-width:82%';
        col.appendChild(bubble);
        col.appendChild(ts);
        wrap.appendChild(col);
      } else {
        wrap.appendChild(bubble);
      }

      msgs.appendChild(wrap);
      setTimeout(function(){ msgs.scrollTop = msgs.scrollHeight; }, 50);

      if (!isUser && !isOpen) { unread++; showBadge(unread); }
    }

    function showTyping() {
      var msgs = document.getElementById('vws-msgs');
      var d = document.createElement('div');
      d.id = 'vws-typing';
      d.style.cssText = 'padding:0 14px;display:flex;gap:8px;align-items:center';
      d.innerHTML = '<div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#1e3a8a,#1d4ed8);flex-shrink:0"></div>' +
        '<div style="background:#0e1525;border:1px solid rgba(255,255,255,.06);border-radius:14px 14px 14px 2px;padding:10px 14px;display:flex;gap:5px;align-items:center">' +
        '<span class="vws-dot-1" style="width:7px;height:7px;border-radius:50%;background:rgba(225,224,204,.5);display:inline-block"></span>' +
        '<span class="vws-dot-2" style="width:7px;height:7px;border-radius:50%;background:rgba(225,224,204,.5);display:inline-block"></span>' +
        '<span class="vws-dot-3" style="width:7px;height:7px;border-radius:50%;background:rgba(225,224,204,.5);display:inline-block"></span>' +
        '</div>';
      msgs.appendChild(d);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function hideTyping() {
      var t = document.getElementById('vws-typing');
      if (t) t.remove();
    }

    function now() {
      var d = new Date();
      var h = d.getHours(), m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
    }

    function setStatus(text) {
      document.getElementById('vws-status').innerHTML =
        '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;margin-right:5px"></span>' + text;
    }

    function botSay(nodeKey, replacements) {
      var node = TREE[nodeKey];
      if (!node) return;
      currentNode = nodeKey;

      /* Clear quick replies while typing */
      document.getElementById('vws-qr').innerHTML = '';
      document.getElementById('vws-form').style.display = 'none';
      setStatus('Assistant is typing…');

      showTyping();
      var delay = 900 + Math.min(node.bot.length * 12, 1400);

      setTimeout(function() {
        hideTyping();
        setStatus('Live Chat · Online now');
        var text = node.bot;
        if (replacements) {
          Object.keys(replacements).forEach(function(k){
            text = text.replace(new RegExp('{' + k + '}', 'g'), replacements[k]);
          });
        }
        addMsg(text, false, now());

        if (node.input) {
          /* Show lead capture form */
          document.getElementById('vws-form').style.display = 'block';
          setTimeout(function(){ document.getElementById('vws-fname').focus(); }, 100);
        } else if (node.final) {
          /* Done — no further interaction needed */
        } else {
          /* Show quick replies */
          var qr = document.getElementById('vws-qr');
          (node.replies || []).forEach(function(r) {
            var b = document.createElement('button');
            b.textContent = r.label;
            b.style.cssText = 'background:#0e1525;border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:7px 13px;font-size:11px;font-weight:600;color:rgba(225,224,204,.75);cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap';
            b.addEventListener('mouseenter', function(){ b.style.background='rgba(29,78,216,.25)'; b.style.borderColor='rgba(29,78,216,.6)'; b.style.color='rgba(225,224,204,1)'; });
            b.addEventListener('mouseleave', function(){ b.style.background='#0e1525'; b.style.borderColor='rgba(255,255,255,.1)'; b.style.color='rgba(225,224,204,.75)'; });
            b.addEventListener('click', function() {
              addMsg(r.label, true, now());
              document.getElementById('vws-qr').innerHTML = '';
              setTimeout(function(){ botSay(r.next); }, 300);
            });
            qr.appendChild(b);
          });
        }
      }, delay);
    }

    /* ── Lead form submit ── */
    document.getElementById('vws-fsub').addEventListener('click', function() {
      var name  = document.getElementById('vws-fname').value.trim();
      var phone = document.getElementById('vws-fphone').value.trim();
      if (!name || !phone) {
        document.getElementById('vws-fname').style.borderColor = name ? 'rgba(255,255,255,.1)' : '#ef4444';
        document.getElementById('vws-fphone').style.borderColor = phone ? 'rgba(255,255,255,.1)' : '#ef4444';
        return;
      }
      userData = { name: name, phone: phone };
      addMsg('Name: ' + name + '\nPhone: ' + phone, true, now());
      document.getElementById('vws-form').style.display = 'none';
      setTimeout(function(){ botSay('done', userData); }, 400);
    });

    /* ── Free-text input ── */
    var freeResponses = [
      "Great question! Fill out the quick form above and Travis will answer that personally. 🙌",
      "I'll make sure Travis sees this. Want to leave your number so he can call you?",
      "For specific questions like that, it's fastest to call Travis directly: <a href='tel:+15618890507' style='color:#60a5fa'>(561) 889-0507</a>",
      "Happy to help! Most answers depend on your specific situation — want Travis to reach out?",
      "That's a good one. Travis can give you a definitive answer — want him to call you?"
    ];
    var freeIdx = 0;
    function sendFreeText() {
      var inp = document.getElementById('vws-input');
      var text = inp.value.trim();
      if (!text) return;
      addMsg(text, true, now());
      inp.value = '';
      document.getElementById('vws-qr').innerHTML = '';
      setTimeout(function(){
        showTyping();
        setTimeout(function(){
          hideTyping();
          addMsg(freeResponses[freeIdx % freeResponses.length], false, now());
          freeIdx++;
          var qr = document.getElementById('vws-qr');
          ['Yes, have him reach out','See pricing','Just browsing'].forEach(function(label, i){
            var b = document.createElement('button');
            b.textContent = label;
            b.style.cssText = 'background:#0e1525;border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:7px 13px;font-size:11px;font-weight:600;color:rgba(225,224,204,.75);cursor:pointer';
            b.addEventListener('click', function(){
              addMsg(label, true, now());
              qr.innerHTML='';
              botSay(i===0?'capture':i===1?'pricing':'browse');
            });
            qr.appendChild(b);
          });
        }, 1000);
      }, 200);
    }
    document.getElementById('vws-send').addEventListener('click', sendFreeText);
    document.getElementById('vws-input').addEventListener('keydown', function(e){ if(e.key==='Enter') sendFreeText(); });

    /* ── Auto-open after 8s (if not dismissed this session) ── */
    if (!sessionStorage.getItem(DISMISSED_KEY)) {
      setTimeout(function(){
        if (!isOpen && !sessionStorage.getItem(OPENED_KEY)) {
          sessionStorage.setItem(OPENED_KEY, '1');
          /* Show badge first for 2s, then open */
          showBadge(1);
          setTimeout(function(){ if (!isOpen) openChat(); }, 2000);
        }
      }, 8000);
    }
  }

  /* ── Wait for React to mount then inject ── */
  var chatAttempts = 0;
  var chatPoll = setInterval(function(){
    chatAttempts++;
    var reactChat = Array.from(document.querySelectorAll('*')).find(function(el){
      var s = window.getComputedStyle(el);
      return s.position==='fixed' && s.bottom==='24px' && s.right==='24px';
    });
    if (reactChat || chatAttempts > 80) {
      clearInterval(chatPoll);
      buildChat();
    }
  }, 150);
  })();
  </script>
  </body>
</html>
