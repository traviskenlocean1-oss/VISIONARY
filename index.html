  <script>
  /* ── PATCH: fix frozen GSAP scroll animations + Services dropdown ── */
  (function() {
    function fixSite() {
      /* 1. Unfreeze every section element stuck at opacity:0 by GSAP */
      document.querySelectorAll('section *').forEach(function(el) {
        var s = el.getAttribute('style') || '';
        var m = s.match(/(?:^|;)\s*opacity:\s*([\d.]+)/);
        if (m && parseFloat(m[1]) === 0) {
          el.style.opacity = '1';
          if (s.indexOf('translateY') !== -1 || s.indexOf('translateX') !== -1) {
            el.style.transform = 'none';
          }
          if (s.indexOf('scale(0') !== -1) {
            el.style.transform = 'none';
          }
        }
      });

      /* 2. Build Services dropdown if the nav is rendered and dropdown not yet injected */
      var servicesLink = Array.from(document.querySelectorAll('nav a')).find(function(a) {
        return a.textContent.trim() === 'Services';
      });
      if (!servicesLink || servicesLink.parentElement.querySelector('[data-vws-dd]')) return;

      var wrapper = servicesLink.parentElement;
      wrapper.style.position = 'relative';

      var items = [
        { label: 'Website Development',  href: '/services/website-development' },
        { label: 'Hosting & Domain',     href: '/services/hosting-domain' },
        { label: 'Website Maintenance',  href: '/services/website-maintenance' },
        { label: 'Website Creation',     href: '/services/website-creation' },
        { label: 'Website Redesign',     href: '/services/website-redesign' },
        { label: 'Logo & Branding',      href: '/services/logo-branding' }
      ];

      var dd = document.createElement('div');
      dd.setAttribute('data-vws-dd', '1');
      dd.style.cssText = [
        'position:absolute',
        'top:calc(100% + 10px)',
        'left:50%',
        'transform:translateX(-50%)',
        'background:#080d1c',
        'border:1px solid rgba(225,224,204,0.1)',
        'border-radius:10px',
        'min-width:230px',
        'padding:6px',
        'opacity:0',
        'visibility:hidden',
        'transition:opacity 0.18s,visibility 0.18s',
        'z-index:9999',
        'box-shadow:0 20px 60px rgba(0,0,0,0.6)'
      ].join(';');

      items.forEach(function(svc) {
        var a = document.createElement('a');
        a.href = svc.href;
        a.textContent = svc.label;
        a.style.cssText = [
          'display:block',
          'padding:10px 16px',
          'color:rgba(225,224,204,0.55)',
          'font-size:10px',
          'font-weight:700',
          'letter-spacing:0.18em',
          'text-transform:uppercase',
          'text-decoration:none',
          'border-radius:6px',
          'transition:background 0.15s,color 0.15s'
        ].join(';');
        a.addEventListener('mouseenter', function() {
          a.style.background = 'rgba(255,255,255,0.05)';
          a.style.color = 'rgba(225,224,204,1)';
        });
        a.addEventListener('mouseleave', function() {
          a.style.background = '';
          a.style.color = 'rgba(225,224,204,0.55)';
        });
        dd.appendChild(a);
      });

      wrapper.appendChild(dd);

      /* Services link itself navigates to /services — dropdown shows on hover only */
      wrapper.addEventListener('mouseenter', function() {
        dd.style.opacity = '1';
        dd.style.visibility = 'visible';
        var chevron = servicesLink.querySelector('svg');
        if (chevron) chevron.style.transform = 'rotate(180deg)';
      });
      wrapper.addEventListener('mouseleave', function() {
        dd.style.opacity = '0';
        dd.style.visibility = 'hidden';
        var chevron = servicesLink.querySelector('svg');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
      });

      /* 3. Logo click → smooth scroll to top, then SPA navigate home */
      var logoA = document.querySelector('header a[href="/"]');
      if (logoA && !logoA.getAttribute('data-vws-logo')) {
        logoA.setAttribute('data-vws-logo', '1');
        logoA.addEventListener('click', function(e) {
          if (window.scrollY > 0) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(function() {
              history.pushState({}, '', '/');
              window.dispatchEvent(new PopStateEvent('popstate'));
            }, 450);
          }
        });
      }

      /* Kill any React-generated dropdown that appears in this wrapper dynamically */
      var reactDDObserver = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.nodeType === 1 && !node.getAttribute('data-vws-dd')) {
              node.style.cssText += ';display:none!important;visibility:hidden!important';
            }
          });
        });
      });
      reactDDObserver.observe(wrapper, { childList: true });
    }

    /* Fix the GSAP mouse-track glow: reposition it to hero center so blue glow is visible */
    function fixGlow() {
      var glow = Array.from(document.querySelectorAll('div')).find(function(el) {
        return el.classList.contains('fixed') && el.classList.contains('inset-0') && el.classList.contains('pointer-events-none');
      });
      if (glow) {
        var cx = Math.round(window.innerWidth * 0.35);
        var cy = Math.round(window.innerHeight * 0.45);
        glow.style.backgroundImage = 'radial-gradient(700px at ' + cx + 'px ' + cy + 'px, rgba(37,99,235,0.18), rgba(0,0,0,0) 80%)';
      }
    }

    /* Run once React has mounted — poll until sections exist */
    var attempts = 0;
    var poll = setInterval(function() {
      attempts++;
      if (document.querySelectorAll('section').length > 1 || attempts > 60) {
        clearInterval(poll);
        fixSite();
        fixGlow();
        setTimeout(fixSite, 800);
        setTimeout(fixGlow, 800);
      }
    }, 100);
  })();
  </script>

  /* ══════════════════════════════════════════════════════
     VWS DESIGN TOKEN SYSTEM — v1
     Reusable light/dark surface classes for all pages.
     Apply .vws-section-light or .vws-section-dark to any
     section element; tokens cascade to all child elements.
     ══════════════════════════════════════════════════════ */
  :root{
    /* Light surface */
    --vws-light-bg:#f7f8fc;
    --vws-light-bg-alt:#ffffff;
    --vws-light-text:#0d1117;
    --vws-light-sub:#374151;
    --vws-light-muted:#6b7280;
    --vws-light-border:rgba(0,0,0,0.08);
    --vws-light-card:#ffffff;
    --vws-light-card-border:rgba(0,0,0,0.07);
    /* Dark surface */
    --vws-dark-bg:#060916;
    --vws-dark-text:#f0f4ff;
    --vws-dark-sub:rgba(240,244,255,0.6);
    --vws-dark-muted:rgba(240,244,255,0.35);
    --vws-dark-border:rgba(255,255,255,0.08);
    --vws-dark-card:rgba(255,255,255,0.04);
    --vws-dark-card-border:rgba(255,255,255,0.08);
    /* Accent (shared) */
    --vws-accent:#2563eb;
    --vws-accent-light:#3b82f6;
  }

  /* ─── LIGHT section token ─── */
  .vws-section-light{background:var(--vws-light-bg)!important;isolation:isolate}
  .vws-section-light h1,.vws-section-light h2,.vws-section-light h3,.vws-section-light h4{color:var(--vws-light-text)!important}
  .vws-section-light p{color:var(--vws-light-sub)!important}
  .vws-section-light .text-white{color:var(--vws-light-text)!important}
  .vws-section-light [class*="text-white"]{color:var(--vws-light-text)!important}
  .vws-section-light [class*="text-gray-"]{color:var(--vws-light-sub)!important}
  .vws-section-light [class*="text-slate-"]{color:var(--vws-light-sub)!important}
  .vws-section-light [class*="text-zinc-"]{color:var(--vws-light-sub)!important}
  .vws-section-light [class*="text-xs"]{color:var(--vws-light-muted)!important}
  /* Preserve blue accents */
  .vws-section-light [class*="text-blue-"]{color:var(--vws-accent)!important}
  .vws-section-light [class*="text-sky-"]{color:var(--vws-accent-light)!important}
  /* Card surfaces */

  .vws-section-light [class*="bg-white\/"]{background:var(--vws-light-card)!important}
  /* Fix inline-styled cream text in light sections — scoped away from h-screen (hero uses cream intentionally) */
  .vws-section-light:not([class*="h-screen"]) [style*="rgba(225, 224, 204"]{color:var(--vws-light-text)!important}
  .vws-section-light:not([class*="h-screen"]) [style*="rgba(225,224,204"]{color:var(--vws-light-text)!important}
  .vws-section-light:not([class*="h-screen"]) [style*="rgb(225, 224, 204)"]{color:var(--vws-light-text)!important}
  .vws-section-light:not([class*="h-screen"]) [style*="rgb(225,224,204)"]{color:var(--vws-light-text)!important}
  /* Fix inline-styled elements with white/near-white at low opacity */
  .vws-section-light [style*="rgba(255, 255, 255, 0."]{color:var(--vws-light-sub)!important}
  /* Generic span fallback for light sections */

  /* ─── DARK section token ─── */

      /* ── Init: Slider drag logic (Task 4) ── */
      function initSlider() {
        setTimeout(function() {
          var wrap = document.getElementById('vws-ba-wrap');
          var before = document.getElementById('vws-ba-before');
          var handle = document.getElementById('vws-ba-handle');
          if (!wrap || !before || !handle) return;
          var dragging = false;

          function setPos(clientX) {
            var rect = wrap.getBoundingClientRect();
            var x = Math.max(0, Math.min(clientX - rect.left, rect.width));
            var pct = (x / rect.width * 100).toFixed(2);
            before.style.width = pct + '%';
            handle.style.left = pct + '%';
          }

          wrap.addEventListener('mousedown', function(e) { dragging = true; setPos(e.clientX); e.preventDefault(); });
          document.addEventListener('mousemove', function(e) { if (dragging) setPos(e.clientX); });
          document.addEventListener('mouseup', function() { dragging = false; });
          wrap.addEventListener('touchstart', function(e) { dragging = true; setPos(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
          document.addEventListener('touchmove', function(e) { if (dragging) { setPos(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});
          document.addEventListener('touchend', function() { dragging = false; });
        }, 100);
      }
    }

                  +'{width:36px!important;height:36px!important;color:'+cfg.lt+'!important}';

      if (!footer) return;
      rebuilt = true;

      /* Hue-rotate the fixed background for non-blue services */
      if (svc.hue !== '0deg' && !document.getElementById('vws-early-hue')) {
        var bgStyle = document.createElement('style');
        bgStyle.id = 'vws-early-hue';
        bgStyle.textContent = '[class~="-z-10"]{filter:hue-rotate('+svc.hue+') saturate(1.4)!important}';
        document.head.appendChild(bgStyle);
      }

      /* Hide ALL React sections — our injected hero lives outside React's tree */
      var allReactSecs = document.querySelectorAll('section:not([id^="vws"])');
      for (var j = 0; j < allReactSecs.length; j++) {
        allReactSecs[j].style.setProperty('display','none','important');
      }

      /* Insert all spec sections before footer. insertBefore(node, footer) each time
         preserves order: hero → problem → steps → included → results → faq → cta → footer */
      function ins(html, id) {
        if (document.getElementById(id)) return;
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        var node = tmp.firstElementChild;
        if (node) footer.parentNode.insertBefore(node, footer);
      }

      ins(buildHeroHTML(SLUG_KEY, svc), 'vws-hero');
      ins(buildProblems(SLUG_KEY, svc), 'vws-problem');
      ins(buildSteps(SLUG_KEY, svc), 'vws-steps');
      ins(buildIncluded(SLUG_KEY, svc), 'vws-included');
      ins(buildResults(SLUG_KEY, svc), 'vws-results');
      ins(buildFAQ(SLUG_KEY, svc), 'vws-faq');
      ins(buildCTA(SLUG_KEY, svc), 'vws-cta');
    }

    /* ── Poll until React renders, then rebuild. Second pass re-hides any React re-renders. ── */
    var svcAttempts = 0;
    var svcPoll = setInterval(function(){
      svcAttempts++;
      if (document.querySelectorAll('section').length > 0 || svcAttempts > 100) {
        clearInterval(svcPoll);
        rebuild();
        setTimeout(function(){
          /* Re-hide any sections React re-rendered after our first pass */
          var reSecs = document.querySelectorAll('section:not([id^="vws"])');
          for (var k = 0; k < reSecs.length; k++) {
            reSecs[k].style.setProperty('display','none','important');
          }
        }, 900);
      }
    }, 150);
    } /* end runServiceDetail */

    /* ── Task 2b: Modal whitener — subtree watch catches React-internal renders ── */
    (function(){
      var MODAL_KEY = 'would you like done';
      var vwsModalBusy = false;
      function styleVwsModal(node) {
        if (node.nodeType !== 1) return;
        if (vwsModalBusy) return;
        /* Fast bail-out: text scan before any DOM queries */
        var txt = (node.textContent || '').toLowerCase();
        if (txt.indexOf(MODAL_KEY) === -1) return;
        vwsModalBusy = true;
        /* Locate the inner card (parent of the h2 that contains the heading) */
        var card = node;
        var h2List = node.querySelectorAll('h2');
        for (var k = 0; k < h2List.length; k++) {
          if (h2List[k].textContent.toLowerCase().indexOf(MODAL_KEY) > -1) {
            var p = h2List[k].parentElement;
            card = (p && p.parentElement && p.parentElement !== node) ? p.parentElement : (p || node);
            break;
          }
        }
        card.style.setProperty('background','#ffffff','important');
        card.style.setProperty('border','1px solid rgba(37,99,235,0.15)','important');
        card.style.setProperty('border-radius','16px','important');
        card.style.setProperty('box-shadow','0 24px 60px rgba(0,0,0,0.10)','important');
        node.querySelectorAll('h1,h2,h3,h4,h5').forEach(function(h){h.style.setProperty('color','#0d1117','important');});
        node.querySelectorAll('p').forEach(function(p){p.style.setProperty('color','#374151','important');});
        /* Style the option buttons (New Website / Website Redesign / Website Updates) */
        node.querySelectorAll('button').forEach(function(btn){
          btn.style.setProperty('background','rgba(37,99,235,0.06)','important');
          btn.style.setProperty('color','#2563eb','important');
          btn.style.setProperty('border','1px solid rgba(37,99,235,0.28)','important');
          btn.style.setProperty('border-radius','10px','important');
        });
        setTimeout(function(){ vwsModalBusy = false; }, 8000);
      }
      var vwsModalObs = new MutationObserver(function(muts){
        muts.forEach(function(m){
          m.addedNodes.forEach(styleVwsModal);
        });
      });
      /* subtree:true required — modal renders inside React root, not as body portal */
      vwsModalObs.observe(document.body, {childList:true, subtree:true});
    })();

    /* ── Kick off on initial load ── */
    setTimeout(runAll, 400);
  })();
  </script>

  <!-- ── TASK 1: Cookie consent banner (site-wide, runs once) ── -->
  <script>
  (function() {
    var STORE_KEY = 'vws_cookie_v1';
    /* Don't show if already answered */
    if (localStorage.getItem(STORE_KEY)) return;

    /* Build banner element */
    var logoSVG = '<svg width="22" height="22" viewBox="0 0 100 100"><rect width="100" height="100" rx="16" fill="#0f172a"/><text x="50" y="78" font-family="Arial Black,sans-serif" font-size="76" font-weight="900" fill="#3b82f6" text-anchor="middle">V</text></svg>';

    var banner = document.createElement('div');
    banner.id = 'vws-cookie-banner';
    banner.innerHTML = ''
      +'<div class="vws-cb-logo">'+logoSVG+'<span class="vws-cb-brand">Visionary Web Studio</span></div>'
      +'<p class="vws-cb-text">We use cookies to improve your browsing experience and understand how visitors interact with our site. <a href="/privacy-policy">Privacy Policy</a></p>'
      +'<div class="vws-cb-btns">'
      +'<button id="vws-cookie-accept">Accept All</button>'
      +'<button id="vws-cookie-deny">Decline</button>'
      +'</div>'
      +'<button id="vws-cookie-manage">Manage preferences</button>';

    function dismiss(choice) {
      localStorage.setItem(STORE_KEY, choice);
      banner.style.transform = 'translateY(calc(100% + 40px))';
      banner.style.opacity = '0';
      setTimeout(function() { if (banner.parentNode) banner.parentNode.removeChild(banner); }, 450);
    }

    banner.querySelector('#vws-cookie-accept').addEventListener('click', function() { dismiss('accepted'); });
    banner.querySelector('#vws-cookie-deny').addEventListener('click', function() { dismiss('denied'); });
    banner.querySelector('#vws-cookie-manage').addEventListener('click', function() {
      /* Simple toggle: re-label to show state and allow re-choice */
      var txt = banner.querySelector('.vws-cb-text');
      txt.innerHTML = 'Essential cookies only (no analytics, no tracking). Choose below to change.<br><a href="/privacy-policy" style="color:rgba(96,165,250,0.8)">Privacy Policy</a>';
      banner.querySelector('#vws-cookie-manage').style.display = 'none';
    });

    /* Suppress the React-rendered cookie banner once it appears */
    function suppressReactBanner() {
      var el = document.querySelector('.fixed.bottom-6.left-6');
      if (el) { el.style.setProperty('display','none','important'); }
    }

    /* Mount banner and animate in */
    function mount() {
      document.body.appendChild(banner);
      suppressReactBanner();
      /* Watch for React banner re-renders */
      var obs = new MutationObserver(suppressReactBanner);
      obs.observe(document.body, {childList:true, subtree:true});
      /* Animate in after short delay */
      setTimeout(function() { banner.classList.add('vws-cb-in'); }, 900);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mount);
    } else {
      mount();
    }
  })();
  </script>
  </body>
</html>
